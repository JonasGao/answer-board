<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Answer Board</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div id="app">
      <header class="app-header">
        <h1 class="app-title">Answer Board</h1>
        <div class="header-controls">
          <div class="settings-group">
            <span class="settings-label">Theme</span>
            <div class="theme-toggle" role="group" aria-label="Theme">
              <button type="button" class="theme-btn" data-theme="light" aria-pressed="false">Light</button>
              <button type="button" class="theme-btn" data-theme="dark" aria-pressed="false">Dark</button>
              <button type="button" class="theme-btn" data-theme="system" aria-pressed="true">System</button>
            </div>
          </div>
          <div class="settings-group">
            <button id="font-settings-btn" class="btn" type="button" title="Configure fonts">Fonts…</button>
          </div>
          <div class="app-actions">
            <button id="add-entry-btn" class="btn btn-primary" type="button" title="Add entry (Enter at the end)">Add</button>
            <button id="renumber-btn" class="btn" type="button" title="Clear all and rebuild from a list of numbers (Alt+Enter)">Renumber</button>
            <button id="copy-all-btn" class="btn btn-primary" type="button" title="Copy all entries (Shift+Enter)">Copy All</button>
            <button id="clear-all-btn" class="btn btn-danger" type="button" title="Clear all entries">Clear</button>
          </div>
          <span class="header-hint">Enter next &middot; Shift+Enter copy all &middot; Alt+Enter renumber &middot; Ctrl+Enter newline</span>
        </div>
      </header>

      <main id="board" class="board"></main>
    </div>

    <dialog id="renumber-dialog" class="dialog renumber-dialog">
      <h2 class="dialog-title">Renumber</h2>
      <div class="renumber-field" role="group" aria-label="Numbers">
        <button
          id="renumber-step-down"
          class="stepper-btn"
          type="button"
          aria-label="Decrease number"
        >
          −
        </button>
        <input
          id="renumber-input"
          class="num-input"
          type="text"
          autocomplete="off"
          spellcheck="false"
          placeholder="e.g. 2, 4, 5"
          aria-label="Numbers"
        />
        <button
          id="renumber-step-up"
          class="stepper-btn"
          type="button"
          aria-label="Increase number"
        >
          +
        </button>
      </div>
      <p id="renumber-hint" class="renumber-hint" aria-live="polite"></p>
      <div class="dialog-actions">
        <button id="renumber-cancel" class="btn" type="button">Cancel</button>
        <button id="renumber-ok" class="btn btn-primary" type="button">OK</button>
      </div>
    </dialog>

    <dialog id="font-dialog" class="dialog font-dialog">
      <h2 class="dialog-title">Font Settings</h2>

      <div class="font-field">
        <label class="font-field-label" for="ui-font-input">Interface</label>
        <input
          id="ui-font-input"
          class="font-input"
          type="text"
          placeholder="'JetBrains Mono', Consolas"
          spellcheck="false"
        />
        <div class="font-preview font-preview-ui" aria-hidden="true">Interface text</div>
      </div>

      <div class="font-field">
        <label class="font-field-label" for="input-font-input">Answer input</label>
        <div class="font-field-row">
          <input
            id="input-font-input"
            class="font-input"
            type="text"
            placeholder="'JetBrains Mono', Consolas"
            spellcheck="false"
          />
          <input
            id="input-font-size"
            class="font-size-input"
            type="number"
            min="6"
            max="200"
            step="1"
            inputmode="numeric"
            placeholder="15"
            aria-label="Answer input font size"
          />
          <span class="font-size-unit">px</span>
        </div>
        <div class="font-preview font-preview-input" aria-hidden="true">Sample answer</div>
      </div>

      <div class="font-field">
        <label class="font-field-label" for="number-font-input">Number</label>
        <div class="font-field-row">
          <input
            id="number-font-input"
            class="font-input"
            type="text"
            placeholder="'JetBrains Mono', Consolas"
            spellcheck="false"
          />
          <input
            id="number-font-size"
            class="font-size-input"
            type="number"
            min="6"
            max="200"
            step="1"
            inputmode="numeric"
            placeholder="14"
            aria-label="Number font size"
          />
          <span class="font-size-unit">px</span>
        </div>
        <div class="font-preview font-preview-number" aria-hidden="true">Q1</div>
      </div>

      <div class="dialog-actions">
        <button id="font-dialog-close" class="btn btn-primary" type="button">Close</button>
      </div>
    </dialog>

    <div id="toast" class="toast" role="status"></div>
  </body>
</html>
