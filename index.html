<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Answer Board</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div id="app">
      <header class="app-header">
        <h1 class="app-title">Answer Board</h1>
        <div class="header-controls">
          <div class="settings-group">
            <span class="settings-label">Theme</span>
            <div class="theme-toggle" role="group" aria-label="Theme">
              <button type="button" class="theme-btn" data-theme="light" aria-pressed="false">Light</button>
              <button type="button" class="theme-btn" data-theme="dark" aria-pressed="false">Dark</button>
              <button type="button" class="theme-btn" data-theme="system" aria-pressed="true">System</button>
            </div>
          </div>
          <div class="settings-group">
            <label class="settings-label" for="font-input">Font</label>
            <input
              id="font-input"
              class="font-input"
              type="text"
              placeholder="'JetBrains Mono', Consolas"
              spellcheck="false"
            />
          </div>
          <div class="app-actions">
            <button id="copy-all-btn" class="btn btn-primary" type="button">Copy All</button>
            <button id="clear-all-btn" class="btn btn-danger" type="button">Clear</button>
          </div>
        </div>
      </header>

      <main id="board" class="board"></main>

      <footer class="app-footer">
        <button id="add-entry-btn" class="btn btn-primary" type="button">Add</button>
        <button id="add-round-btn" class="btn" type="button">New Round</button>
        <button id="copy-latest-btn" class="btn" type="button" title="Copy Latest Batch">Copy Batch</button>
      </footer>
    </div>

    <div id="toast" class="toast" role="status"></div>
  </body>
</html>
