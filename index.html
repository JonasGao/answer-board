<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Answer Board</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <div class="header-inner">
          <nav id="session-tabs" class="session-tabs" role="tablist" aria-label="Grilling sessions"></nav>
          <div class="app-actions" aria-label="Board actions">
            <button id="add-entry-btn" class="btn" type="button" title="Add entry (Enter at the end)">Add</button>
            <button id="renumber-btn" class="btn" type="button" title="Clear all and rebuild from a list of numbers (Alt+Enter)">Renumber</button>
            <button id="copy-all-btn" class="btn btn-primary" type="button" title="Copy all entries (Shift+Enter)">Copy All</button>
            <button id="appearance-btn" class="btn btn-icon" type="button" aria-label="Appearance settings" title="Appearance settings">&#9881;</button>
            <div class="overflow-wrap">
              <button id="overflow-btn" class="btn btn-icon" type="button" aria-label="More actions" aria-haspopup="menu" aria-expanded="false" title="More actions">&#8942;</button>
              <div id="overflow-menu" class="overflow-menu" role="menu" aria-label="More actions" hidden>
                <button id="clear-all-btn" class="menu-item menu-item-danger" type="button" role="menuitem" title="Clear all entries">Clear board</button>
              </div>
            </div>
          </div>
        </div>
      </header>
      <div id="round-bar" class="round-bar" hidden></div>
      <main id="board" class="board" role="tabpanel"></main>
    </div>

    <dialog id="renumber-dialog" class="dialog renumber-dialog">
      <div class="dialog-header">
        <h2 class="dialog-title">Renumber</h2>
        <button class="dialog-close btn btn-icon" type="button" aria-label="Close renumber dialog" title="Close">&#215;</button>
      </div>
      <label class="field-label" for="renumber-input">Question numbers</label>
      <div class="renumber-field" role="group" aria-label="Numbers">
        <button id="renumber-step-down" class="stepper-btn" type="button" aria-label="Decrease number" title="Decrease number">&#8722;</button>
        <input id="renumber-input" class="num-input" type="text" autocomplete="off" spellcheck="false" placeholder="2, 4, 5" aria-describedby="renumber-hint" />
        <button id="renumber-step-up" class="stepper-btn" type="button" aria-label="Increase number" title="Increase number">+</button>
      </div>
      <p id="renumber-hint" class="renumber-hint" aria-live="polite"></p>
      <div class="dialog-actions">
        <button id="renumber-cancel" class="btn" type="button">Cancel</button>
        <button id="renumber-ok" class="btn btn-primary" type="button">Replace board</button>
      </div>
    </dialog>

    <dialog id="appearance-dialog" class="dialog appearance-dialog">
      <div class="dialog-header">
        <h2 class="dialog-title">Appearance</h2>
        <button id="appearance-dialog-close" class="dialog-close btn btn-icon" type="button" aria-label="Close appearance settings" title="Close">&#215;</button>
      </div>
      <div class="dialog-scroll">
        <section class="appearance-section" aria-labelledby="theme-heading">
          <h3 id="theme-heading" class="section-label">Theme</h3>
          <div class="theme-toggle" role="group" aria-label="Theme">
            <button type="button" class="theme-btn" data-theme="light" aria-pressed="false">Light</button>
            <button type="button" class="theme-btn" data-theme="dark" aria-pressed="false">Dark</button>
            <button type="button" class="theme-btn" data-theme="system" aria-pressed="true">System</button>
          </div>
        </section>
        <section class="appearance-section" aria-labelledby="fonts-heading">
          <h3 id="fonts-heading" class="section-label">Fonts</h3>
          <div class="font-field">
            <label class="field-label" for="ui-font-input">Interface</label>
            <input id="ui-font-input" class="font-input" type="text" placeholder="'JetBrains Mono', Consolas" spellcheck="false" />
          </div>
          <div class="font-field">
            <label class="field-label" for="input-font-input">Answer input</label>
            <div class="font-field-row">
              <input id="input-font-input" class="font-input" type="text" placeholder="'JetBrains Mono', Consolas" spellcheck="false" />
              <input id="input-font-size" class="font-size-input" type="number" min="6" max="200" step="1" inputmode="numeric" placeholder="15" aria-label="Answer input font size" />
              <span class="font-size-unit">px</span>
            </div>
          </div>
          <div class="font-field">
            <label class="field-label" for="number-font-input">Question number</label>
            <div class="font-field-row">
              <input id="number-font-input" class="font-input" type="text" placeholder="'JetBrains Mono', Consolas" spellcheck="false" />
              <input id="number-font-size" class="font-size-input" type="number" min="6" max="200" step="1" inputmode="numeric" placeholder="14" aria-label="Question number font size" />
              <span class="font-size-unit">px</span>
            </div>
          </div>
          <div class="font-field">
            <label class="field-label" for="code-font-input">Code</label>
            <div class="font-field-row">
              <input id="code-font-input" class="font-input" type="text" placeholder="ui-monospace, monospace" spellcheck="false" />
              <input id="code-font-size" class="font-size-input" type="number" min="6" max="200" step="1" inputmode="numeric" placeholder="15" aria-label="Code font size" />
              <span class="font-size-unit">px</span>
            </div>
          </div>
          <div class="appearance-preview" aria-hidden="true">
            <span class="preview-number">Q12</span>
            <textarea class="entry-input preview-answer" readonly>Sample answer
Second line shows the live answer input preview.</textarea>
          </div>
          <div class="code-preview" aria-hidden="true"><code>inline()</code><pre><code>const answer = "preview";
console.log(answer);</code></pre></div>
        </section>
      </div>
      <div class="dialog-actions">
        <button id="appearance-dialog-close-bottom" class="btn btn-primary" type="button">Done</button>
      </div>
    </dialog>
    <div id="toast" class="toast" role="status"></div>
  </body>
</html>
